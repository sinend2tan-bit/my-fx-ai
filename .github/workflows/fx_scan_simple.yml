name: FX Simple Scanner

on:
  workflow_dispatch:

permissions:
  contents: read

# 同じワークフローの多重実行を防ぎ、状態キャッシュの競合を避ける。
concurrency:
  group: fx-simple-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-scanner-simple.txt

      - name: Install dependencies
        run: pip install -r requirements-scanner-simple.txt

      # 前回実行が保存した状態と履歴を復元する。本スキャンとは別の
      # キャッシュ名前空間（fx-scan-simple-state-）を使い、互いに干渉しない。
      # キャッシュが無い冷間スタートでも、履歴は空から開始できる。
      - name: Restore simple scan state
        uses: actions/cache/restore@v4
        with:
          path: |
            scan_state_simple.json
            scan_history_simple.json
          key: fx-scan-simple-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fx-scan-simple-state-

      - name: Run simple FX scanner
        run: python fx_scanner_simple.py

      # 実行後、更新された状態と履歴を新しいキーで保存する。
      - name: Save simple scan state
        uses: actions/cache/save@v4
        with:
          path: |
            scan_state_simple.json
            scan_history_simple.json
          key: fx-scan-simple-state-${{ github.run_id }}-${{ github.run_attempt }}

      # 状態ファイルの控えを成果物として保存する（キャッシュ消失時の復旧用）。
      # 保存に失敗してもスキャン本体の結果には影響させない。
      - name: Backup simple scan state as artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: scan-state-simple-${{ github.run_number }}
          path: |
            scan_state_simple.json
            scan_history_simple.json
          retention-days: 30
          if-no-files-found: warn
