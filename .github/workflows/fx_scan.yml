name: FX Cloud Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

# 状態は Git コミットではなく Actions キャッシュで受け渡すため、書き込み権限は不要。
permissions:
  contents: read

# 同じワークフローの多重実行を防ぎ、状態キャッシュの競合を避ける。
concurrency:
  group: fx-cloud-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-scanner.txt

      - name: Install dependencies
        run: pip install -r requirements-scanner.txt

      # 前回実行が保存した scan_state.json を復元する。
      # キーは実行ごとに変え、restore-keys で最新世代を拾う (actions/cache の標準パターン)。
      # キャッシュが無い冷間スタートでも scanner.py の load_state() が空状態で開始するため問題ない。
      - name: Restore scan state
        uses: actions/cache/restore@v4
        with:
          path: scan_state.json
          key: fx-scan-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fx-scan-state-

      - name: Run FX scan and validation
        run: python scanner.py

      # 実行後、更新された状態を新しいキーで保存する。同一キーへは保存できないため、
      # 保存は復元とは別ステップ・別キーにする。
      - name: Save scan state
        uses: actions/cache/save@v4
        with:
          path: scan_state.json
          key: fx-scan-state-${{ github.run_id }}-${{ github.run_attempt }}
      # 状態ファイルの控えを成果物として保存する（キャッシュ消失時の復旧用）。
      # 保存に失敗してもスキャン本体の結果には影響させない。
      - name: Backup scan state as artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: scan-state-${{ github.run_number }}
          path: scan_state.json
          retention-days: 30
          if-no-files-found: warn
