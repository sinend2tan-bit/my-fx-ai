name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-scanner.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-scanner.txt
          pip install pytest==8.3.4

      - name: Compile check
        run: python -m py_compile scanner.py fx_scanner_simple.py app.py

      - name: Smoke tests (no network)
        run: python -m pytest tests/ -q

  apptest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-scanner.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-scanner.txt
          pip install streamlit==1.66.1 plotly==7.1.0 pytest==8.3.4

      - name: App smoke tests (no network)
        run: python -m pytest tests/test_app_smoke.py -q
